<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Palazzo Penelope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
        <div class="header-left"></div> 
        <a href="index.html" class="header-center-logo">PALAZZO<br>PENELOPE</a>
        <nav>
            <a href="our-story.html">Our story</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="press.html">press</a>
            <a href="gallery.html">gallery</a>
        </nav>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </header>

    <div class="mobile-drawer" id="mobile-drawer">
        <a href="our-story.html" class="drawer-link">Our story</a>
        <a href="contact.html" class="drawer-link">Contact</a>
        <a href="press.html" class="drawer-link">press</a>
        <a href="gallery.html" class="drawer-link">gallery</a>
    </div>

    <main class="page-section">
        <div class="contact-block">
            <p>
                Use the email below to ask about programming, rates and availability, or just to say hello.<br>

            </p>
            <p>
                <a href="mailto:ciao@masseriaschiuma.com" style="color: inherit; text-decoration: none; border-bottom: 1px solid currentColor;">ciao@masseriaschiuma.com</a>
            </p>
            <a href="https://www.instagram.com/palazzo_penelope/" style="color: inherit; text-decoration: none; display: inline-block; margin-top: 3rem;">
                Instagram<br>
                Puglia, Italy
            </a>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const drawer = document.getElementById('mobile-drawer');

            if (hamburger && drawer) {
                hamburger.onclick = function() {
                    hamburger.classList.toggle('active');
                    drawer.classList.toggle('active');
                    document.body.style.overflow = drawer.classList.contains('active') ? 'hidden' : '';
                };
            }
        });
    </script>
</body>
</html>
